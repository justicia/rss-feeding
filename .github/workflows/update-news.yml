name: Update news digest

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and summarize recent articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECENT_DAYS: "7"
          MAX_PER_SOURCE: "5"
        run: python fetch_news.py
      - name: Commit the page and persistent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history.json
          git diff --cached --quiet || git commit -m "Update news digest"
          git push
